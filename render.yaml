services:
  - type: web
    name: sweet-album
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: data
      - key: OSS_ACCESS_KEY_ID
        sync: false
      - key: OSS_ACCESS_KEY_SECRET
        sync: false
      - key: OSS_ENDPOINT
        sync: false
      - key: OSS_BUCKET_NAME
        sync: false
      - key: OSS_BASE_URL
        sync: false
      - key: OSS_UPLOAD_DIR
        value: sweet-album/
